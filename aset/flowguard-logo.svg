<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="face" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8FF5E4"/>
      <stop offset="0.45" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0.6" x2="1" y2="0.4">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="waveSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="18" result="b"/>
      <feFlood flood-color="#020617" flood-opacity="0.75"/>
      <feComposite in2="b" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="handShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="5" result="b"/>
      <feFlood flood-color="#020617" flood-opacity="0.6"/>
      <feComposite in2="b" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Perisai: sisi tebal (3D) -->
    <path d="M256 104C312 128 362 138 400 142V250C400 346 340 410 256 444C172 410 112 346 112 250V142C150 138 200 128 256 104Z"
          fill="none" stroke="url(#side)" stroke-width="58" stroke-linejoin="round"/>
    <!-- Perisai: permukaan depan -->
    <path d="M256 88C312 112 362 122 400 126V234C400 330 340 394 256 428C172 394 112 330 112 234V126C150 122 200 112 256 88Z"
          fill="none" stroke="url(#face)" stroke-width="58" stroke-linejoin="round"/>
    <!-- Kilau atas -->
    <path d="M256 70C314 95 366 105 418 109V170" fill="none" stroke="url(#gloss)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <path d="M256 70C198 95 146 105 94 109V170" fill="none" stroke="url(#gloss)" stroke-width="12" stroke-linecap="round" opacity="0.6"/>

    <!-- Jarum jam -->
    <g filter="url(#handShadow)" stroke="#F8FAFC" stroke-width="26" stroke-linecap="round" fill="none">
      <path d="M256 250V178"/>
      <path d="M256 250L308 276"/>
    </g>
    <circle cx="256" cy="250" r="17" fill="#F8FAFC"/>

    <!-- Gelombang: sisi tebal -->
    <path d="M72 362C150 296 206 312 254 344C312 382 370 356 418 286C432 266 446 250 466 242"
          fill="none" stroke="url(#waveSide)" stroke-width="46" stroke-linecap="round" transform="translate(0 14)"/>
    <!-- Gelombang: permukaan -->
    <path d="M72 362C150 296 206 312 254 344C312 382 370 356 418 286C432 266 446 250 466 242"
          fill="none" stroke="url(#wave)" stroke-width="46" stroke-linecap="round"/>
    <!-- Kilau gelombang -->
    <path d="M92 344C158 294 206 306 250 334C306 368 362 346 408 282" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Bintang kilau -->
  <path filter="url(#glow)" fill="#F0FDFA" d="M448 46C451 70 458 77 482 80C458 83 451 90 448 114C445 90 438 83 414 80C438 77 445 70 448 46Z"/>
</svg>
