<body class="bg-bg-primary text-text-primary font-body antialiased overflow-x-hidden">
  <!-- Floating Organic Blobs Background -->
  <div aria-hidden="true" class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full bg-accent-teal/10 blur-3xl"></div>
    <div class="absolute top-1/3 -right-24 w-[420px] h-[420px] rounded-full bg-accent-purple/10 blur-3xl"></div>
    <div class="absolute -bottom-24 left-1/3 w-96 h-96 rounded-full bg-accent-focus/15 blur-3xl"></div>
  </div>

  <div class="relative z-10 min-h-[1024px] flex flex-col items-center justify-center p-gutter-md lg:p-gutter-xl" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <main class="w-full max-w-3xl bg-bg-surface/60 backdrop-blur-2xl border border-text-primary/15 rounded-xl p-gutter-lg lg:p-gutter-xl flex flex-col gap-gutter-xl shadow-2xl">
      <!-- Stepper Header -->
      <header class="flex items-center justify-between gap-gutter-md pb-gutter-md border-b border-text-primary/10">
        <span data-design-text-token="label-lg" class="text-label-lg text-text-secondary">Langkah 1 dari 3</span>
        <div class="flex items-center gap-gutter-sm" aria-label="Progres onboarding">
          <span class="w-3 h-3 rounded-full bg-accent-focus shadow-md shadow-accent-focus/40"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-border-subtle"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-border-subtle"></span>
        </div>
      </header>

      <!-- Step 1: Role Selection -->
      <section class="flex flex-col gap-gutter-lg text-center">
        <div>
          <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg text-text-primary">Siapa kamu?</h1>
          <p data-design-text-token="body-md" class="text-body-md text-text-secondary mt-gutter-xs">Kami sesuaikan ritme fokus dan pengingat istirahat untukmu.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-gutter-md">
          <button type="button" aria-pressed="true" class="min-h-[140px] p-gutter-lg rounded-lg bg-focus-container/80 border border-accent-focus shadow-lg shadow-accent-focus/20 flex flex-col items-center justify-center gap-gutter-sm scale-[1.02]">
            <span class="material-symbols-outlined text-accent-focus text-[40px]" style="font-variation-settings: &#39;FILL&#39; 1;">menu_book</span>
            <span data-design-text-token="label-lg" class="text-label-lg text-on-focus-container">Mahasiswa</span>
          </button>

          <button type="button" class="min-h-[140px] p-gutter-lg rounded-lg bg-bg-elevated/50 border border-text-primary/10 hover:bg-bg-elevated flex flex-col items-center justify-center gap-gutter-sm transition-colors duration-state-change">
            <span class="material-symbols-outlined text-accent-teal text-[40px]">laptop_mac</span>
            <span data-design-text-token="label-lg" class="text-label-lg text-text-primary">Pekerja Jarak Jauh</span>
          </button>

          <button type="button" class="min-h-[140px] p-gutter-lg rounded-lg bg-bg-elevated/50 border border-text-primary/10 hover:bg-bg-elevated flex flex-col items-center justify-center gap-gutter-sm transition-colors duration-state-change">
            <span class="material-symbols-outlined text-accent-purple text-[40px]">palette</span>
            <span data-design-text-token="label-lg" class="text-label-lg text-text-primary">Freelancer</span>
          </button>
        </div>
      </section>

      <!-- Step 2 Preview Card (Daily Work Limit) -->
      <section class="bg-bg-elevated/40 border border-text-primary/10 rounded-lg p-gutter-lg flex flex-col gap-gutter-sm">
        <div class="flex items-center justify-between">
          <span data-design-text-token="label-lg" class="text-label-lg text-text-secondary">Batas aman jam kerja (Langkah 2)</span>
          <span class="inline-flex items-center gap-1 px-gutter-sm py-0.5 rounded-full bg-break-container text-on-break-container">
            <span class="material-symbols-outlined text-caption-xs">check</span>
            <span data-design-text-token="caption-xs" class="text-caption-xs">Disarankan: 8 jam</span>
          </span>
        </div>
        <input type="range" min="4" max="12" value="8" aria-label="Batas jam kerja harian" class="w-full h-2 rounded-full bg-bg-primary accent-accent-focus cursor-pointer">
        <div class="flex justify-between text-caption-xs text-text-secondary">
          <span>4 jam</span>
          <span class="text-text-primary tabular-nums">8 jam</span>
          <span>12 jam</span>
        </div>
      </section>

      <!-- Wizard Footer -->
      <footer class="flex items-center justify-between gap-gutter-md pt-gutter-sm">
        <button type="button" class="min-h-[44px] px-gutter-md rounded-md text-text-secondary hover:text-text-primary">
          <span data-design-text-token="label-lg" class="text-label-lg">Lewati</span>
        </button>
        <button type="button" class="inline-flex items-center gap-gutter-sm min-h-[48px] px-gutter-xl rounded-md bg-gradient-to-r from-accent-focus to-accent-purple text-on-accent-focus shadow-lg shadow-accent-focus/25 hover:opacity-90">
          <span data-design-text-token="label-lg" class="text-label-lg">Lanjut</span>
          <span class="material-symbols-outlined text-label-lg">arrow_forward</span>
        </button>
      </footer>
    </main>
  </div>
