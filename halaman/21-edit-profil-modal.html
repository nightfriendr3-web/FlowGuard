<body class="bg-bg-primary text-text-primary font-body antialiased">
  <div class="min-h-[1024px] relative flex items-center justify-center p-gutter-md lg:p-gutter-xl" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <div aria-hidden="true" class="fixed inset-0 bg-bg-primary/75 backdrop-blur-lg z-0"></div>

    <!-- Edit Profil Modal with Soft Gradient Mesh -->
    <div role="dialog" aria-modal="true" aria-labelledby="edit-profile-title" class="relative z-10 w-full max-w-[500px] bg-modal-mesh backdrop-blur-2xl border border-text-primary/15 rounded-xl p-gutter-lg lg:p-gutter-xl flex flex-col gap-gutter-lg shadow-2xl">
      <header class="flex items-center justify-between">
        <div class="flex items-center gap-gutter-sm">
          <span class="material-symbols-outlined text-accent-purple">edit</span>
          <h1 id="edit-profile-title" data-design-text-token="headline-md" class="font-headline text-headline-md text-text-primary">Edit Profil</h1>
        </div>
        <button type="button" aria-label="Tutup" class="inline-flex items-center justify-center w-11 h-11 rounded-md bg-bg-elevated/60 text-text-secondary border border-text-primary/10 hover:text-text-primary">
          <span class="material-symbols-outlined">close</span>
        </button>
      </header>

      <!-- Avatar Picker -->
      <div class="flex flex-col items-center gap-gutter-sm">
        <div class="relative w-24 h-24 rounded-full bg-gradient-to-br from-accent-focus to-accent-purple flex items-center justify-center text-on-accent-focus font-headline text-headline-lg border-2 border-text-primary/20 shadow-lg">
          AP
          <button type="button" aria-label="Ganti Foto" class="absolute -bottom-1 -right-1 w-9 h-9 rounded-full bg-bg-elevated border border-text-primary/20 text-text-primary flex items-center justify-center hover:bg-bg-surface">
            <span class="material-symbols-outlined text-label-lg">photo_camera</span>
          </button>
        </div>
      </div>

      <!-- Profile Form -->
      <form class="flex flex-col gap-gutter-md">
        <label class="flex flex-col gap-gutter-xs">
          <span data-design-text-token="label-lg" class="text-label-lg text-text-primary">Nama Lengkap</span>
          <input type="text" value="Andi Pratama" class="w-full min-h-[44px] rounded-md bg-bg-primary/60 border border-border-subtle px-gutter-md text-body-md text-text-primary focus:border-accent-focus focus:ring-0">
        </label>

        <label class="flex flex-col gap-gutter-xs">
          <span data-design-text-token="label-lg" class="text-label-lg text-text-secondary">Email</span>
          <input type="email" value="andi@email.com" readonly class="w-full min-h-[44px] rounded-md bg-bg-primary/30 border border-border-subtle px-gutter-md text-body-md text-text-secondary cursor-not-allowed">
        </label>

        <label class="flex flex-col gap-gutter-xs">
          <span data-design-text-token="label-lg" class="text-label-lg text-text-primary">Peran</span>
          <select class="w-full min-h-[44px] rounded-md bg-bg-primary/60 border border-border-subtle px-gutter-md text-body-md text-text-primary focus:border-accent-focus focus:ring-0">
            <option selected>Mahasiswa</option>
            <option>Pekerja Jarak Jauh</option>
            <option>Freelancer</option>
          </select>
        </label>

        <label class="flex flex-col gap-gutter-xs">
          <span data-design-text-token="label-lg" class="text-label-lg text-text-primary">Bio singkat (opsional)</span>
          <input type="text" value="Mahasiswa Teknik Informatika" placeholder="Ceritakan sedikit tentang dirimu..." class="w-full min-h-[44px] rounded-md bg-bg-primary/60 border border-border-subtle px-gutter-md text-body-md text-text-primary focus:border-accent-focus focus:ring-0">
        </label>

        <div class="h-px bg-text-primary/10 my-gutter-xs"></div>

        <div class="flex flex-col gap-gutter-sm">
          <span data-design-text-token="label-lg" class="text-label-lg text-text-primary">Ubah Password</span>
          <input type="password" placeholder="Password Lama" aria-label="Password Lama" class="w-full min-h-[44px] rounded-md bg-bg-primary/60 border border-border-subtle px-gutter-md text-body-md text-text-primary placeholder:text-text-secondary focus:border-accent-focus focus:ring-0">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-gutter-sm">
            <input type="password" placeholder="Password Baru" aria-label="Password Baru" class="w-full min-h-[44px] rounded-md bg-bg-primary/60 border border-border-subtle px-gutter-md text-body-md text-text-primary placeholder:text-text-secondary focus:border-accent-focus focus:ring-0">
            <input type="password" placeholder="Konfirmasi Baru" aria-label="Konfirmasi Password Baru" class="w-full min-h-[44px] rounded-md bg-bg-primary/60 border border-border-subtle px-gutter-md text-body-md text-text-primary placeholder:text-text-secondary focus:border-accent-focus focus:ring-0">
          </div>
        </div>
      </form>

      <footer class="flex flex-col gap-gutter-sm">
        <button type="button" class="w-full min-h-[48px] rounded-md bg-gradient-to-r from-accent-focus to-accent-purple text-on-accent-focus shadow-lg shadow-accent-focus/25 hover:opacity-90">
          <span data-design-text-token="label-lg" class="text-label-lg">Simpan Perubahan</span>
        </button>
        <button type="button" class="w-full min-h-[40px] rounded-md text-text-secondary hover:text-text-primary">
          <span data-design-text-token="label-lg" class="text-label-lg">Batal</span>
        </button>
      </footer>
    </div>
  </div>
